# MediMind Brain Tumor Intelligence System
# Docker Compose Configuration for Development and Production

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medimind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-medimind-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models:ro
      - backend_logs:/app/logs
      - model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medimind-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medimind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medimind-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Redis Cache (for session storage and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: medimind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medimind-network

  # PostgreSQL Database (for production data storage)
  postgres:
    image: postgres:16-alpine
    container_name: medimind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-medimind}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medimind_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-medimind_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimind} -d ${POSTGRES_DB:-medimind_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medimind-network

  # Ollama for local LLM inference (optional)
  ollama:
    image: ollama/ollama:latest
    container_name: medimind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    profiles:
      - local-llm
    networks:
      - medimind-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Named volumes for persistent data
volumes:
  backend_logs:
    driver: local
  model_cache:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  ollama_models:
    driver: local

# Network configuration
networks:
  medimind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
